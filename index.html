<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | niuniu</title>
      <style id="niu-webgl-responsive-style">
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background: #000;
      }
      body {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        text-align: left !important;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      @supports (height: 100dvh) {
        body {
          height: 100dvh;
        }
      }
      #unity-canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        display: block;
      }
    </style>
      <script id="niu-unity-message-bridge">
      window.NiuUnityAllowedMessages = { sendRoomToken: true, repateLogin: true, enterGameTokenFail: true };
      window.NiuNotifyWebAudioVisibility = function (visible) {
        if (visible && window.NiuResumeWebAudioContexts) window.NiuResumeWebAudioContexts();
      };
      if (!window.NiuWebAudioVisibilityListenerRegistered) {
        window.NiuWebAudioVisibilityListenerRegistered = true;
        document.addEventListener('visibilitychange', function () {
          window.NiuNotifyWebAudioVisibility(document.visibilityState !== 'hidden');
        });
        window.addEventListener('blur', function () { window.NiuNotifyWebAudioVisibility(false); });
        window.addEventListener('focus', function () { window.NiuNotifyWebAudioVisibility(true); });
        window.addEventListener('pagehide', function () { window.NiuNotifyWebAudioVisibility(false); });
        window.addEventListener('pageshow', function () { window.NiuNotifyWebAudioVisibility(true); });
      }
      window.NiuRegisterCocosMessageListener = function () {
        if (window.NiuCocosMessageListenerRegistered) return;
        window.NiuCocosMessageListenerRegistered = true;
        window.addEventListener('message', function (e) {
          var data = e.data;
          console.log('[NiuUnityBridge] received message:', data);
          if (!data || typeof data !== 'object') return;
          var type = data.type || data.method || data.name;
          var payload = data.payload == null ? data.params : data.payload;
          payload = payload == null ? {} : payload;
          var message = typeof payload === 'string' ? payload : JSON.stringify(payload);
          console.log('[NiuUnityBridge] dispatch:', type, message);
          if (!window.NiuUnityAllowedMessages[type]) {
            console.warn('[NiuUnityBridge] ignored unsupported message:', type, data);
            return;
          }
          var unity = window.unityInstance;
          if (!unity || !unity.SendMessage) {
            console.warn('Unity instance is not ready for message:', type);
            return;
          }
          unity.SendMessage('DeZhouBridge', type, message);
        });
      };
    </script>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1" style="width: 1080px; height: 1920px; background: url('1.8.204/Build/Export.jpg') center / cover"></canvas>
    <script src="1.8.204/Build/Export.loader.js"></script>
    <script src="Dependencies/agora-rtm-2.2.3.min.js"></script>
    <script src="Dependencies/AgoraRTC_N-4.24.3.js"></script>
    <script>
window.NiuWebGLPixelRatio = Math.min(window.devicePixelRatio || 1, 3);
createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "1.8.204/Build/Export.data.unityweb",
        frameworkUrl: "1.8.204/Build/Export.framework.js.unityweb",
        codeUrl: "1.8.204/Build/Export.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "niuniu",
        productVersion: "1.8.204",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: window.NiuWebGLPixelRatio,
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        if (window.NiuRegisterCocosMessageListener) {
          window.NiuRegisterCocosMessageListener();
        }
        if (window.NiuNotifyWebAudioVisibility) {
          window.NiuNotifyWebAudioVisibility(document.visibilityState !== 'hidden');
        }
      });
    </script>
  </body>
</html>
